[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kafil-music"
version = "4.0.0"
description = "Kafil Music — Spotify-style hybrid music recommendation backend (FastAPI + PostgreSQL/pgvector)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.29",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "sqladmin>=0.16.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.0",
    "alembic>=1.13.0",
    "numpy>=1.26.0",
    # PostgreSQL drivers + vector type
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
]

[project.optional-dependencies]
# Heavier ML backends. The core recommender runs on NumPy alone; these are
# drop-in upgrades enabled via RECO_CF_BACKEND / RECO_ANN_BACKEND settings.
ml = [
    "scikit-learn>=1.4.0",
    "implicit>=0.7.2",
]
ann = [
    "faiss-cpu>=1.8.0",
    "annoy>=1.17.3",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "vulture>=2.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle; I = isort; F401 catches unused imports (dead code)
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines handled case-by-case

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
